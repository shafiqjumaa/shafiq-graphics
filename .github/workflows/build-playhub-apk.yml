name: Build PlayHub APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'playhub/**'
      - '.github/workflows/build-playhub-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -d "${ANDROID_HOME}/platforms/android-35" || yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare offline HTML assets
        run: |
          mkdir -p playhub/android/app/src/main/assets
          cp playhub/index.html playhub/android/app/src/main/assets/index.html
      - name: Build installable debug APK
        run: gradle :app:assembleDebug --no-daemon
        working-directory: playhub/android
      - uses: actions/upload-artifact@v4
        with:
          name: PlayHub-installable-APK
          path: playhub/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
