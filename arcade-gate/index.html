 else if(game==='ships'){s.fleets=[fleet(),fleet()];s.shots=[Array(64).fill(0),Array(64).fill(0)]}
 else{s.cells=Array(game==='xo'?9:game==='four'?42:64).fill(0);
 if(game==='reversi'){s.cells[27]=s.cells[36]=2;s.cells[28]=s.cells[35]=1}}
 return s
}
function flips(b,i,p){
 if(b[i])return [];
 const out=[];
 for(const [dy,dx] of dirs){
  let y=(i>>3)+dy,x=i%8+dx,line=[];
  while(y>=0&&y<8&&x>=0&&x<8&&b[y*8+x]===3-p){line.push(y*8+x);y+=dy;x+=dx}
  if(y>=0&&y<8&&x>=0&&x<8&&b[y*8+x]===p)out.push(...line)
 }return out
}
function lined(b,w,i,p,count){
 return [[1,0],[0,1],[1,1],[1,-1]].some(([dy,dx])=>{
  let n=1;
  for(const d of [-1,1]){
   let y=Math.floor(i/w)+dy*d,x=i%w+dx*d;
   while(y>=0&&y<b.length/w&&x>=0&&x<w&&b[y*w+x]===p){n++;y+=dy*d;x+=dx*d}
  }return n>=count
 })
}
function act(s,player,m){
 if(!s||s.turn!==player||s.result!==null||!m)return false;
 let i=m.i;const p=player+1,other=1-player,b=s.cells;s.log=s.log||'';
 if(s.game==='chess'){
  if(!/^[a-h][1-8]$/.test(m.from)||!/^[a-h][1-8]$/.test(m.to)||!['q','r','b','n'].includes(m.promotion))return false;
  const move=chessEngine.move({from:m.from,to:m.to,promotion:m.promotion});if(!move)return false;
  s.fen=chessEngine.fen();s.log=move.san;
  if(chessEngine.in_checkmate())s.result=player;else if(chessEngine.in_draw())s.result=2;else if(chessEngine.in_check())s.log+=' · كش';
 }else{
  const limit=s.game==='ships'?64:b.length;if(!Number.isInteger(i)||i<0||i>=limit)return false;
  if(s.game==='ships'){
   const shots=s.shots[player];if(shots[i])return false;
   shots[i]=s.fleets[other][i]?2:1;s.log=shots[i]===2?'إصابة مباشرة':'لم تُصب السفينة';
   if(shots.filter(x=>x===2).length===9)s.result=player
  }else if(s.game==='reversi'){
   const changed=flips(b,i,p);if(!changed.length)return false;
   b[i]=p;changed.forEach(j=>b[j]=p);
   if(!b.some((_,j)=>flips(b,j,3-p).length)){
    if(b.some((_,j)=>flips(b,j,p).length)){s.turn=other;s.log='لا توجد حركة للخصم. العب مجدداً.'}
    else{const a=b.filter(x=>x===1).length,d=b.filter(x=>x===2).length;s.result=a===d?2:a>d?0:1}
   }else s.log=''
  }else{
   const w=s.game==='xo'?3:7;
   if(w===7){i=35+i%7;while(i>=0&&b[i])i-=7}
   if(i<0||b[i])return false;b[i]=p;
   if(lined(b,w,i,p,w===3?3:4))s.result=player;else if(b.every(Boolean))s.result=2
  }
 }
 s.seq++;s.turn=1-s.turn;return true
}
function visible(s,player){
 if(s.game!=='ships')return s;
 const {fleets,...rest}=s;return {...rest,own:fleets[player]}
}

</script>
<script>
const BASE='https://shafiqjumaa.github.io/shafiq-graphics/arcade-gate/';
const app=document.getElementById('app'),el=id=>document.getElementById(id);
let screen='home',game='chess',mode='local',s=null,peer=null,conn=null,room='',ready=false,status='',covered=false,selected='',promotion=null,joinTimer=0;
const mySeat=()=>mode==='guest'?1:mode==='host'?0:s.turn;
const title=()=>catalog[game][0];
function art(g){
 const n=g==='xo'?3:4;
 const pattern={chess:['♜','♞','♝','♚','♟','♟','♟','♟'],xo:['×','○','','','×','○','○','','×'],ships:['≈','','▰','≈','','≈','▰','','▰','▰','','≈'],four:[],reversi:[]}[g];
 let tiles='';for(let i=0;i<n*n;i++){
 let cls=g==='chess'&&(Math.floor(i/n)+i%n)%2?'dark':'';
 if(g==='four'&&i>=7||g==='reversi'&&[5,6,9,10].includes(i))cls=i%3?'puck':'disc';
 tiles+='<i class="'+cls+'">'+(pattern[i]||'')+'</i>'
 }return '<div aria-hidden="true" class="mini" style="--n:'+n+'">'+tiles+'</div>'
}
function artwork(g){return '<div class="art" style="--bg:'+catalog[g][3]+';--light:'+catalog[g][4]+'">'+art(g)+'</div>'}
function btn(label,action,kind='soft'){const b=document.createElement('button');b.className=kind;b.textContent=label;b.onclick=action;return b}
function dialog(t,body,label,fn,input=false,val=''){
 const d=el('modal');el('modalTitle').textContent=t;el('modalBody').textContent=body;el('field').hidden=!input;el('field').value=val;el('formError').textContent='';
 el('confirmBtn').textContent=label;el('confirmBtn').onclick=()=>fn(el('field').value);if(!d.open)d.showModal()
}
function closeModal(){el('modal').close()}
el('closeBtn').onclick=closeModal;
function release(){
 clearTimeout(joinTimer);const old=peer;peer=null;conn=null;ready=false;room='';if(old)old.destroy();selected='';promotion=null;covered=false
}
function home(){
 release();screen='home';s=null;mode='local';app.innerHTML='<section class="hero"><div class="heroText"><h1>دورك على الرقعة</h1><p>تحدَّ صديقك في جولة شطرنج.</p><button class="primary" id="feature">العب الشطرنج</button></div><div class="heroArt">'+art('chess')+'</div></section><div class="shelf"><h2>كل الألعاب</h2><span class="count">٥ ألعاب</span></div><section class="cards"></section>';
 el('feature').onclick=()=>detail('chess');
 for(const [g,data] of Object.entries(catalog)){const c=btn('',()=>detail(g),'card');c.innerHTML=artwork(g)+'<div class="ct"><strong>'+data[0]+'</strong><small>'+data[1]+'</small></div>';app.querySelector('.cards').append(c)}
}
function exitTo(fn){if(screen==='play'&&(s?.result==null||mode!=='local'))dialog('مغادرة الغرفة؟','ستنتهي جلستك الحالية.','مغادرة',()=>{closeModal();fn()});else fn()}
el('homeBtn').onclick=()=>exitTo(home);
function detail(g){release();mode='local';screen='detail';game=g;app.innerHTML='<button class="back" id="back">عودة إلى الألعاب</button><section class="panel">'+artwork(g)+'<h1>'+title()+'</h1><p class="intro">'+catalog[g][2]+'</p><div class="actions" id="actions"></div></section>';el('back').onclick=home;el('actions').append(btn('دعوة صديق',host),btn('على جهاز واحد',()=>{s=initial(g);screen='play';covered=g==='ships';render()},'outline'))}
function parseLink(raw){try{const u=new URL(raw.trim()),q=new URLSearchParams(u.hash.slice(1)),id=q.get('room'),g=q.get('game');return /^[a-f0-9]{32}$/.test(id)&&Object.prototype.hasOwnProperty.call(catalog,g)?{id,g}:null}catch{return null}}
function joinPrompt(){dialog('فتح دعوة','الصق رابط الغرفة الذي أرسله صديقك.','دخول الغرفة',raw=>{const v=parseLink(raw);if(!v){el('formError').textContent='تحقق من رابط الدعوة.';return}closeModal();guest(v)},true)}
el('joinBtn').onclick=()=>exitTo(joinPrompt);
function invite(){return BASE+'#game='+game+'&room='+room}
function shareLink(){const url=invite();if(navigator.userAgent.includes('ArcadeGateAndroid')){location.href='gate-share:'+encodeURIComponent(url);return}if(navigator.share){navigator.share({title:'بوابة الألعاب · '+title(),url}).catch(e=>{if(e.name!=='AbortError')copy()});return}copy();
 function copy(){dialog('رابط الغرفة','أرسل الرابط لصديقك وأبقِ اللعبة مفتوحة.','نسخ الرابط',async()=>{el('field').select();try{await navigator.clipboard.writeText(url);closeModal()}catch{if(document.execCommand('copy'))closeModal();else el('formError').textContent='حدّد الرابط وانسخه.'}},true,url)}
}
function timer(message){clearTimeout(joinTimer);joinTimer=setTimeout(()=>{if(!ready&&screen==='play'){status=message;render()}},18000)}
function network(target){
 let p;try{p=mode==='host'?new Peer('arcgate-'+room,{secure:true}):new Peer({secure:true})}catch{status='تعذر تشغيل الاتصال على هذا الجهاز.';render();return}peer=p;
 p.on('open',()=>{if(p!==peer)return;clearTimeout(joinTimer);if(mode==='host'){status='الغرفة جاهزة. أرسل الرابط لصديقك.';render()}else{status='جارٍ الاتصال بالمضيف…';render();bind(p.connect('arcgate-'+target,{reliable:true,metadata:{game}}),p);timer('تعذر الوصول للمضيف. تحقق من الإنترنت ثم أعد المحاولة.')}});
 p.on('connection',c=>{if(p!==peer||mode!=='host'||conn||c.metadata?.game!==game){c.on('open',()=>{c.send({type:'busy'});setTimeout(()=>c.close(),300)});return}bind(c,p)});
 p.on('error',()=>{if(p!==peer)return;status='تعذر الاتصال بالغرفة. تحقق من الإنترنت ومن بقاء المضيف في اللعبة.';render()});
 p.on('disconnected',()=>{if(p!==peer||ready)return;status='انقطع اتصال خدمة الغرف. أعد المحاولة.';render()})
}
function bind(c,p){
 conn=c;c.on('open',()=>{if(peer!==p||conn!==c)return;clearTimeout(joinTimer);ready=true;status='';if(mode==='host')sync();render()});
 c.on('data',msg=>{if(conn!==c||!msg)return;
 if(mode==='host'&&msg.type==='move'&&msg.seq===s.seq&&act(s,1,msg.move)){sync();render()}
 if(mode==='guest'&&msg.type==='state'&&msg.state?.game===game){s=msg.state;selected='';promotion=null;render()}
 if(msg.type==='busy'){status='الغرفة مشغولة بلاعب آخر.';ready=false;render()}
 });
 const lost=()=>{if(conn!==c)return;conn=null;ready=false;selected='';promotion=null;status=status||'انقطع اتصال اللاعب الآخر. يمكن العودة برابط الغرفة ما دام المضيف هنا.';render()};
 c.on('close',lost);c.on('error',lost)
}
function sync(){if(conn?.open)conn.send({type:'state',state:visible(s,1)})}
function host(){release();mode='host';screen='play';s=initial(game);room=Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');status='جارٍ إنشاء الغرفة…';render();timer('لم تستجب خدمة الغرف. تحقق من الإنترنت وأعد المحاولة.');network()}
function guest(v){release();mode='guest';screen='play';game=v.g;room=v.id;s=null;status='جارٍ فتح الدعوة…';render();timer('لم تستجب خدمة الغرف. أعد المحاولة.');network(room)}
function sendMove(m){selected='';promotion=null;if(mode==='guest'){if(conn?.open)conn.send({type:'move',seq:s.seq,move:m});return}
 if(act(s,mySeat(),m)){if(mode==='host')sync();if(mode==='local'&&game==='ships'&&s.result===null)covered=true;render()}}
function playerName(i){return (game==='chess'?['الأبيض','الأسود']:game==='xo'?['لاعب ×','لاعب ○']:game==='ships'?['اللاعب الأول','اللاعب الثاني']:['الذهبي','الأبيض'])[i]}
function render(){
 if(screen!=='play')return;
 app.innerHTML='<button id="back" class="back">عودة إلى الألعاب</button><section class="panel"><h2>'+title()+'</h2><p class="intro" id="sub"></p><div id="notice" role="status" class="notice"></div><div id="arena"></div><div class="actions" id="actions"></div></section>';el('back').onclick=()=>exitTo(home);
 el('sub').textContent=mode==='local'?'لاعبان على جهاز واحد':'غرفة خاصة · '+(mode==='host'?'أنت المضيف':'أنت الضيف');
 if(mode!=='local'&&(!ready||!s)){
 el('notice').textContent=status||'جارٍ تحميل الجولة…';
 if(mode==='host'&&peer?.open)el('actions').append(btn('إرسال رابط الدعوة',shareLink));
 if(!ready)el('actions').append(btn('إعادة الاتصال',()=>mode==='guest'?guest({g:game,id:room}):peer?.open?shareLink():host(),'outline'));return}
 const seat=mySeat(),active=s.result===null&&(mode==='local'||s.turn===seat);
 el('notice').textContent=s.result===2?'انتهت الجولة بالتعادل':s.result!==null?'فاز '+playerName(s.result):mode==='local'?'دور '+playerName(s.turn):active?'دورك · '+playerName(seat):'دور صديقك · '+playerName(s.turn);
 const arena=el('arena');
 if(covered){arena.append('مرّر الجهاز إلى '+playerName(s.turn)+' ليشاهد أسطوله.',btn('كشف لوحتي',()=>{covered=false;render()}));return}
 if(s.log){const t=document.createElement('p');t.className='intro';t.textContent='آخر نقلة · '+s.log;arena.append(t)}
 if(game==='chess')chessBoard(arena,active);
 else if(game==='ships')seaBoards(arena,seat,active);
 else{const w=game==='xo'?3:game==='four'?7:8;
 board(arena,w,s.cells.length,game==='xo'?'xo':'discBoard',(cell,i)=>{
 const v=s.cells[i];if(game==='xo'){cell.textContent=['','×','○'][v];if(v===2)cell.classList.add('other')}
 else{cell.innerHTML='<span class="chip '+(['','a','b'][v])+'"></span>';if(game==='reversi'&&active&&flips(s.cells,i,s.turn+1).length)cell.classList.add('legal')}
 cell.disabled=!active||(game==='four'?!!s.cells[i%7]:!!v||game==='reversi'&&!flips(s.cells,i,s.turn+1).length);
 cell.onclick=()=>sendMove({i});cell.setAttribute('aria-label',cell.getAttribute('aria-label')+'، '+(v?playerName(v-1):'فارغة'))
 })}
 if(s.result!==null&&mode!=='guest')el('actions').append(btn('جولة جديدة',()=>{s=initial(game);covered=mode==='local'&&game==='ships';sync();render()}));
 if(mode==='host')el('actions').append(btn('رابط الغرفة',shareLink,'outline'))
}
function board(parent,w,n,cls,draw){
 const grid=document.createElement('div');grid.className='board '+cls;grid.style.setProperty('--n',w);if(w===3)grid.style.setProperty('--size','325px');
 for(let i=0;i<n;i++){const b=document.createElement('button');b.className='cell';b.setAttribute('aria-label','صف '+(1+Math.floor(i/w))+' عمود '+(1+i%w));draw(b,i);grid.append(b)}parent.append(grid)
}
function seaBoards(arena,seat,active){
 const own=s.own||s.fleets[seat];
 for(const mine of [false,true]){const h=document.createElement('h3');h.className='fleetTitle';h.textContent=mine?'أسطولك':'مياه الخصم';arena.append(h);
 board(arena,8,64,'sea'+(mine?' smallBoard':''),(b,i)=>{const v=s.shots[mine?1-seat:seat][i];b.textContent=v===2?'✹':v===1?'•':mine&&own[i]?'■':'';b.classList.add(v===2?'hit':v===1?'miss':mine&&own[i]?'ship':'water');b.disabled=mine||!!v||!active;b.onclick=()=>sendMove({i})})
 }}
function chessBoard(arena,active){
 const engine=new Chess(s.fen),moves=selected?engine.moves({square:selected,verbose:true}):[],glyph={p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'};
 board(arena,8,64,'chess',(b,j)=>{const i=mode==='guest'?63-j:j,x=i%8,y=Math.floor(i/8),sq='abcdefgh'[x]+(8-y),p=engine.get(sq),dest=moves.filter(m=>m.to===sq);if((x+y)%2)b.classList.add('blackSquare');if(p){b.textContent=glyph[p.type];if(p.color==='w')b.classList.add('whitePiece')}b.setAttribute('aria-label',sq+(p?' '+({p:'بيدق',n:'حصان',b:'فيل',r:'رخ',q:'وزير',k:'ملك'}[p.type])+' '+playerName(p.color==='w'?0:1):''));if(sq===selected)b.classList.add('selected');if(dest.length)b.classList.add('dest');b.disabled=!active||!!promotion;
 b.onclick=()=>{if(dest.length){if(dest.some(m=>m.promotion)){promotion={from:selected,to:sq};render()}else sendMove({from:selected,to:sq,promotion:'q'})}else{selected=p?.color===engine.turn()&&sq!==selected?sq:'';render()}}});
 if(promotion){const row=document.createElement('div');row.className='promotion';row.append('ترقية البيدق');for(const [k,t] of Object.entries({q:'وزير',r:'رخ',b:'فيل',n:'حصان'}))row.append(btn(t,()=>sendMove({...promotion,promotion:k}),'outline'));arena.append(row)}
}
home();const incoming=parseLink(location.href);if(incoming)guest(incoming);

</script>
