-size:10px;direction:ltr;text-align:left;color:#aff7ed;background:#061924;padding:11px;border-radius:9px;overflow-wrap:anywhere;user-select:text}.alert{background:#422527;border:1px solid #b76e61;border-radius:9px;padding:8px 12px;color:#ffe0db;font-size:12px;margin:10px 0}.toast{position:absolute;z-index:24;bottom:115px;left:50%;transform:translateX(-50%);background:#091b29f2;border:1px solid #4dd6c7;padding:11px 15px;color:white;border-radius:13px;text-align:center;max-width:88%;pointer-events:none;font-size:13px}.coverLogo{width:86px;height:86px;border-radius:20px;margin:0 auto 12px;background:linear-gradient(150deg,#58e6c8,#2482a8);display:grid;place-items:center;box-shadow:0 0 35px #4bdbdb44;font-size:47px}.labelChip{display:inline-block;background:#123a4c;border:1px solid #42838a;border-radius:99px;padding:6px 11px;color:#b6eee7;font-size:11px}.score{font-size:11px;color:#b1e7dd}.winTitle{color:var(--gold)}.hint{position:absolute;z-index:11;left:50%;top:75px;transform:translateX(-50%);background:#061924ed;border:1px solid #367d87;border-radius:12px;padding:9px 14px;font-size:12px;max-width:80%;text-align:center;pointer-events:none}.legend{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}.selection{color:#dcf5fe;font-size:11px;max-width:320px;text-align:left;direction:rtl}

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('arena'),ctx=canvas.getContext('2d');
const W=35,H=23,SZ=W*H,WIN=0.95,DT=0.1,HOST_RATE=.8;
const COLORS=['#4cddc1','#ffb758','#79aefc','#e48ff7'];
const BOT_NAMES=['الجنرال كركر','الكابتن زعتر','القائد فلافل','أبو الدروع'];
const SERVERS={1:'wss://broker.emqx.io:8084/mqtt',2:'wss://broker.hivemq.com:8884/mqtt'};
const MODES={duo:2,trio:3,quad:4};
let viewW=0,viewH=0,dpr=1,cam={scale:1,offsetX:0,offsetY:0},selected=-1,hovered=-1,rallyMode=false,fraction=.5,toastTimer=0,frameLast=0,pointer=null;
let state='menu',mode='solo',difficulty='medium',duration=600,world=null,playing=false,winner=0,tickTimer=0,animFrame=0,uiTick=0;
let meId=makeId(),mySlot=1,room='',session='',roomRole='',roomCap=2,roster=[],brokerId=1,client=null,joined=false,netPulse=0,lastSnapshot=0,netTimer=0,startTrigger=0,connectVersion=0;
const prefs={name:localStorage.getItem('ph_conquest_name')||'القائد',color:Number(localStorage.getItem('ph_conquest_color')||0),server:localStorage.getItem('ph_conquest_server')||'auto',round:Number(localStorage.getItem('ph_conquest_round')||600)};
function makeId(){const b=new Uint8Array(12);if(globalThis.crypto?.getRandomValues)crypto.getRandomValues(b);else b.forEach((_,i)=>b[i]=Math.random()*256);return Array.from(b,x=>x.toString(16).padStart(2,'0')).join('')}
const escape=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const tile=(x,y)=>y*W+x,tx=i=>i%W,ty=i=>Math.floor(i/W),inside=(x,y)=>x>=0&&x<W&&y>=0&&y<H;
const dist=(a,b)=>Math.hypot(tx(a)-tx(b),ty(a)-ty(b));
const aliveColors=()=>COLORS.map((c,i)=>'<button type="button" class="colorBtn '+(prefs.color===i?'sel':'')+'" style="background:'+c+'" data-color="'+i+'" aria-label="لون '+(i+1)+'"></button>').join('');
const fromHub=()=>window.parent!==window;
function report(type,extra={}){if(fromHub())parent.postMessage({type,game:'conquest',...extra},'*')}
function shareUrl(){let u;try{u=new URL(fromHub()?parent.location.href:location.href)}catch{u=new URL('https://shafiqjumaa.github.io/shafiq-graphics/playhub/')}if(!/^https:$/.test(u.protocol)||u.hostname==='appassets.androidplatform.net')u=new URL('https://shafiqjumaa.github.io/shafiq-graphics/playhub/');u.search='';u.hash='';u.searchParams.set('game','conquest');u.searchParams.set('room',room);return u.toString()}
function notice(s){const b=$('toast');b.textContent=s;b.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>b.classList.add('hidden'),2900)}
function setPanel(html){$('shade').classList.remove('hidden');$('panel').innerHTML=html}
function hidePanel(){$('shade').classList.add('hidden')}
function menu(){cleanupNet();finishLoop();playing=false;state='menu';$('battleUi').classList.add('hidden');selected=-1;setPanel(`<div class="coverLogo">♜</div><div class="eyebrow">PLAYHUB • TERRITORY WARFARE</div><h1>صراع <span style="color:var(--teal)">النفوذ</span></h1><p>ابدأ بقلعة صغيرة، احتلّ الأراضي، اجمع الجنود تلقائياً، ووجّه هجماتك للسيطرة على <b>95%</b> من الخريطة.</p><div class="field"><label>اسم القائد</label><input id="playerName" maxlength="18" placeholder="اكتب اسمك" value="${escape(prefs.name)}"></div><div class="colors">${aliveColors()}</div><div class="field"><label>مدة الجولة</label><select id="roundTime"><option value="600">10 دقائق</option><option value="900">15 دقيقة</option></select></div><div class="gridModes"><button class="choice" id="soloMode">🤖 ضد الكمبيوتر</button><button class="choice" id="twoMode">👥 اللعب مع صديق</button><button class="choice" id="threeMode">⚔️ غرفة جماعية</button></div><p class="small">نقاط القيادة محدودة وتتجدد. يمكنك تحديد نقطة تجمع وإرسال قوات تلقائياً.</p><button class="btn fullBtn" id="goHub">العودة إلى بوابة الألعاب</button>`);
 $('roundTime').value=String(prefs.round);$('roundTime').onchange=e=>{prefs.round=Number(e.target.value);localStorage.setItem('ph_conquest_round',String(prefs.round))};$('playerName').oninput=e=>{prefs.name=e.target.value.slice(0,18).trim()||'القائد';localStorage.setItem('ph_conquest_name',prefs.name)};
 document.querySelectorAll('[data-color]').forEach(e=>e.onclick=()=>{prefs.color=Number(e.dataset.color);localStorage.setItem('ph_conquest_color',String(prefs.color));document.querySelectorAll('[data-color]').forEach(b=>b.classList.toggle('sel',b===e))});
 $('soloMode').onclick=()=>startSolo();$('twoMode').onclick=()=>setupRoom(2);$('threeMode').onclick=()=>setupRoom(4);$('goHub').onclick=()=>{if(fromHub())report('playhub-exit');else location.href='https://shafiqjumaa.github.io/shafiq-graphics/playhub/'};
}
function setupRoom(cap=4){state='setup';roomCap=cap;setPanel(`<div class="eyebrow">PLAYHUB • MULTIPLAYER</div><h1>غرفة صراع النفوذ</h1><p>أنشئ غرفة، ثم أرسل رابطاً واحداً للأصدقاء. يدخلون دون تسجيل أو نسخ كود.</p><div class="cols"><div class="field"><label>عدد اللاعبين</label><select id="seatCount"><option value="2">لاعبان</option><option value="3">3 لاعبين</option><option value="4">4 لاعبين</option></select></div><div class="field"><label>مدة الجولة</label><select id="roundRoom"><option value="600">10 دقائق</option><option value="900">15 دقيقة</option></select></div></div><div class="field"><label>سيرفر الاتصال</label><select id="brokerSel"><option value="auto">⚡ تلقائي</option><option value="1">EMQX</option><option value="2">HiveMQ</option></select></div><button id="hostBtn" class="btn pri fullBtn">إنشاء الغرفة</button><div class="field"><label>أو ألصق رمز الغرفة</label><input id="joinCode" placeholder="مثال 1-123456" dir="ltr"></div><button class="btn fullBtn" id="joinBtn">انضمام</button><button class="btn fullBtn" id="goBack">عودة</button>`);
 $('seatCount').value=String(cap);$('roundRoom').value=String(prefs.round);$('brokerSel').value=prefs.server;
 $('hostBtn').onclick=()=>{prefs.server=$('brokerSel').value;localStorage.setItem('ph_conquest_server',prefs.server);createRoom({cap:Number($('seatCount').value),duration:Number($('roundRoom').value),server:prefs.server})};
 $('joinBtn').onclick=()=>joinRoom($('joinCode').value);$('goBack').onclick=menu;
}
function makeLand(seed=0){const r=mulberry32(seed||14839),water=new Uint8Array(SZ),owner=new Uint8Array(SZ),garrison=new Uint8Array(SZ);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let edge=Math.min(x,W-1-x,y,H-1-y);let river=Math.abs(x-W/2-Math.sin(y*.45)*2)<.8&&y>4&&y<H-5;let isWater=(edge<2&&r()<.31)||(river&&r()<.27)||(r()<.025);water[tile(x,y)]=isWater?1:0;garrison[tile(x,y)]=isWater?0:rand(1,7)}return{water,owner,garrison}}
function mulberry32(seed){return()=>{seed|=0;seed=seed+0x6d2b79f5|0;let t=Math.imul(seed^seed>>>15,1|seed);t^=t+Math.imul(t^t>>>7,61|t);return ((t^t>>>14)>>>0)/4294967296}}
function capitalSites(count){return [tile(4,4),tile(W-5,H-5),tile(W-5,4),tile(4,H-5)].slice(0,count)}
function spawnWorld(count,dur,seed=rand(10000,900000)){const terrain=makeLand(seed),p=[];let pids=roster.filter(a=>a.slot>=1).slice(0,count);if(mode==='solo'){pids=[{slot:1,id:meId,name:prefs.name,color:prefs.color}];for(let i=2;i<=count;i++)pids.push({slot:i,id:'bot-'+i,name:BOT_NAMES[(i-2)%BOT_NAMES.length],color:(i-1)%4,bot:true})}const capitals=capitalSites(count);for(let i=0;i<count;i++){const u=pids[i];let root=capitals[i];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const x=tx(root)+dx,y=ty(root)+dy;if(!inside(x,y))continue;const j=tile(x,y);terrain.water[j]=0;terrain.owner[j]=i+1;terrain.garrison[j]=9}p.push({id:u.id,slot:i+1,name:u.name,color:u.color,capital:root,troops:92,energy:6,share:0,bot:!!u.bot,orders:0,rally:-1,aiTick:0})}
 return {seed,owner:terrain.owner,water:terrain.water,garrison:terrain.garrison,players:p,waves:[],duration:dur,time:dur,roundTime:0,step:0,finished:false,winner:0,nextWave:1,count,landTotal:terrain.water.reduce((n,v)=>n+(v?0:1),0)}}
function pickPercent(w,slot){if(!w)return 0;let n=0;for(const v of w.owner)if(v===slot)n++;return n/Math.max(1,w.landTotal)}
function nearestOwned(w,slot,target){let best=-1,score=Infinity;for(let i=0;i<SZ;i++)if(w.owner[i]===slot){let d=dist(i,target);if(d<score){best=i;score=d}}return best}
function isNeighbor(w,slot,index){const x=tx(index),y=ty(index);for(const [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1]]){const nx=x+dx,ny=y+dy;if(inside(nx,ny)&&w.owner[tile(nx,ny)]===slot)return true}return false}
function orderAttack(w,slot,target,portion,asRally=false){if(!w||w.finished||target<0||target>=SZ||w.water[target])return false;const p=w.players[slot-1];if(!p)return false;
 if(asRally){if(p.energy<1||w.owner[target]===slot)return false;p.rally=target;p.energy-=1;return true}
 if(p.energy<.8||p.troops<10)return false;const from=nearestOwned(w,slot,target);if(from<0)return false;const d=dist(from,target);if(d>12)return false;const units=clamp(Math.floor(p.troops*portion),5,130);if(units>p.troops)return false;p.troops-=units;p.energy-=.8;p.orders++;w.waves.push({id:w.nextWave++,slot,from,target,units,remaining:.35+d*.22,total:.35+d*.22});return true}
function capture(w,packet){const i=packet.target,slot=packet.slot,enemy=w.owner[i];let troops=packet.units;if(enemy===slot){w.garrison[i]=clamp(w.garrison[i]+Math.ceil(troops*.45),1,255);return}const defense=w.garrison[i]+(enemy?6:1);troops-=defense;if(troops>0){w.owner[i]=slot;w.garrison[i]=clamp(troops,2,38)}else w.garrison[i]=Math.max(1,Math.round(-troops*.3))}
function aiOrders(w,p){if(!p.bot||p.troops<13||p.energy<1)return;const frontier=[];for(let i=0;i<SZ;i++)if(!w.water[i]&&w.owner[i]!==p.slot&&isNeighbor(w,p.slot,i))frontier.push(i);if(!frontier.length)return;frontier.sort((a,b)=>{const av=(w.owner[a]?3:0)+w.garrison[a]+Math.random()*8;const bv=(w.owner[b]?3:0)+w.garrison[b]+Math.random()*8;return av-bv});const target=frontier[0];orderAttack(w,p.slot,target,Math.min(.5,.18+p.troops/450))}
function tickWorld(w,dt){if(!w||w.finished)return;w.roundTime+=dt;w.time=Math.max(0,w.duration-w.roundTime);w.step++;
 for(const p of w.players){const share=pickPercent(w,p.slot);p.share=share;p.troops=clamp(p.troops+(1.1+share*w.landTotal*.17)*dt,0,900);p.energy=clamp(p.energy+dt/4.8,0,6);if(p.bot&&w.roundTime-p.aiTick>1.2){p.aiTick=w.roundTime+Math.random()*.45;aiOrders(w,p)}if(p.rally>=0&&w.step%32===0){if(w.owner[p.rally]===p.slot)p.rally=-1;else orderAttack(w,p.slot,p.rally,.16)}}
 const arrived=[];for(const q of w.waves){q.remaining-=dt;if(q.remaining<=0)arrived.push(q)}w.waves=w.waves.filter(x=>x.remaining>0);for(const q of arrived)capture(w,q);
 for(const p of w.players){p.share=pickPercent(w,p.slot);if(p.share>=WIN){w.winner=p.slot;w.finished=true;break}}
 if(w.time<=0&&!w.finished){w.finished=true;w.winner=[...w.players].sort((a,b)=>b.share-a.share)[0]?.slot||1}
}
function makeSnapshot(w){return{t:'state',room,s:Date.now(),seed:w.seed,step:w.step,remaining:Math.ceil(w.time),duration:w.duration,owner:encodeBytes(w.owner),water:encodeBytes(w.water),garrison:encodeBytes(w.garrison),players:w.players.map(p=>({slot:p.slot,name:p.name,color:p.color,troops:Math.floor(p.troops),energy:Math.round(p.energy*10)/10,share:p.share,rally:p.rally})),waves:w.waves.slice(0,90),finished:w.finished,winner:w.winner,landTotal:w.landTotal,count:w.count}}
function encodeBytes(a){let s='';for(let i=0;i<a.length;i+=1024)s+=String.fromCharCode(...a.slice(i,i+1024));return btoa(s)}
function decodeBytes(str){const s=atob(str),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function applySnapshot(m){if(!m||!m.owner||m.owner.length<100)return;if(!world)world={};if(world.step&&m.step<world.step)return;world.owner=decodeBytes(m.owner);world.water=decodeBytes(m.water);world.garrison=decodeBytes(m.garrison);world.step=m.step;world.time=m.remaining;world.duration=m.duration;world.players=m.players;world.waves=m.waves||[];world.finished=m.finished;world.winner=m.winner;world.landTotal=m.landTotal;world.count=m.count;world.seed=m.seed;playing=true;if(state!=='game')showGame();if(world.finished)finishGame(world.winner)}
function startSolo(){cleanupNet();mode='solo';state='game';mySlot=1;roster=[];world=spawnWorld(4,prefs.round);selected=world.players[0].capital;showGame();startLoop()}
function ensureDimensions(){dpr=Math.min(2,devicePixelRatio||1);viewW=Math.max(1,innerWidth);viewH=Math.max(1,innerHeight);canvas.width=Math.round(viewW*dpr);canvas.height=Math.round(viewH*dpr);canvas.style.width=viewW+'px';canvas.style.height=viewH+'px';cam.scale=Math.min((viewW-20)/W,(viewH-35)/H);cam.offsetX=(viewW-W*cam.scale)/2;cam.offsetY=(viewH-H*cam.scale)/2}
function pointToTile(px,py){const x=Math.floor((px-cam.offsetX)/cam.scale),y=Math.floor((py-cam.offsetY)/cam.scale);return inside(x,y)?tile(x,y):-1}
function draw(){if(!ctx)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#0a2736';ctx.fillRect(0,0,viewW,viewH);if(!world?.owner)return;
 const unit=cam.scale,ox=cam.offsetX,oy=cam.offsetY;ctx.save();ctx.translate(ox,oy);ctx.scale(unit,unit);ctx.fillStyle='#143d50';ctx.fillRect(-1,-1,W+2,H+2);
 const pixels=['#193d48','#2b716a','#876b43','#415d9e','#82629d'];
 for(let i=0;i<SZ;i++){const x=tx(i),y=ty(i);if(world.water[i]){ctx.fillStyle='#11445a';ctx.fillRect(x+.02,y+.02,.96,.96);ctx.fillStyle='#24596b';if((i%7)===0)ctx.fillRect(x+.18,y+.46,.45,.06);continue}const o=world.owner[i]||0;ctx.fillStyle=o?COLORS[world.players?.[o-1]?.color??((o-1)%4)]:'#54746d';ctx.globalAlpha=o?.79:.53;ctx.fillRect(x+.015,y+.015,.97,.97);ctx.globalAlpha=1;ctx.fillStyle='#bdd6bc16';if((i+Math.floor(y*.3))%11===0)ctx.fillRect(x+.26,y+.18,.14,.14)}
 // Grid and softly glowing frontier boundaries
 if(unit>8){ctx.strokeStyle='#092a354c';ctx.lineWidth=.025;ctx.beginPath();for(let x=0;x<=W;x++){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=0;y<=H;y++){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke()}
 if(world.players){for(const p of world.players){let i=p.capital;if(typeof i!=='number'){i=capitalSites(world.count||4)[p.slot-1]}const x=tx(i)+.5,y=ty(i)+.5;ctx.save();ctx.translate(x,y);ctx.shadowColor=COLORS[p.color];ctx.shadowBlur=.45;ctx.fillStyle='#071b29';ctx.beginPath();ctx.arc(0,0,.37,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle=COLORS[p.color];ctx.lineWidth=.13;ctx.stroke();ctx.fillStyle='#f6ffff';ctx.textAlign='center';ctx.font='bold .55px system-ui';ctx.fillText('♜',0,.18);ctx.restore();if(p.rally>=0){ctx.strokeStyle=COLORS[p.color];ctx.lineWidth=.11;ctx.setLineDash([.18,.14]);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(tx(p.rally)+.5,ty(p.rally)+.5);ctx.stroke();ctx.setLineDash([])}}}
 if(world.waves){for(const q of world.waves){const progress=clamp(1-q.remaining/q.total,0,1);const x=tx(q.from)+.5+(tx(q.target)-tx(q.from))*progress,y=ty(q.from)+.5+(ty(q.target)-ty(q.from))*progress;ctx.fillStyle=COLORS[world.players[q.slot-1]?.color||0];ctx.strokeStyle='#fff';ctx.lineWidth=.05;ctx.beginPath();ctx.arc(x,y,.25,0,Math.PI*2);ctx.fill();ctx.stroke()}}
 if(selected>=0){const x=tx(selected),y=ty(selected);ctx.strokeStyle='#fff8b3';ctx.lineWidth=.12;ctx.strokeRect(x+.06,y+.06,.88,.88)}ctx.restore();
 }
function renderFrame(t){if(t-frameLast>15){draw();frameLast=t}animFrame=requestAnimationFrame(renderFrame)}
function showGame(){state='game';hidePanel();$('battleUi').classList.remove('hidden');ensureDimensions();if(!animFrame)animFrame=requestAnimationFrame(renderFrame);updateUi();}
function finishLoop(){clearInterval(tickTimer);tickTimer=0;cancelAnimationFrame(animFrame);animFrame=0}
function startLoop(){clearInterval(tickTimer);tickTimer=setInterval(()=>{if(state!=='game'||!world||world.finished)return;if(mode==='solo'||roomRole==='host'){tickWorld(world,DT);if(mode==='online'&&Date.now()-netPulse>HOST_RATE*1000){netPulse=Date.now();publish(makeSnapshot(world))}if(world.finished){if(mode==='online')publish(makeSnapshot(world));finishGame(world.winner)}}},DT*1000);if(!animFrame)animFrame=requestAnimationFrame(renderFrame)}
function updateUi(){if(state!=='game'||!world?.players)return;const p=world.players.find(p=>p.slot===mySlot);if(!p)return;const pct=pickPercent(world,mySlot)*100;
 $('pct').textContent=pct.toFixed(1)+'%';$('progressFill').style.width=Math.min(100,pct/95*100)+'%';$('troopLabel').textContent='👥 قوات: '+Math.floor(p.troops)+' • الأراضي: '+Math.round(pct*world.landTotal/100);$('commandLabel').textContent='نقاط القيادة: '+Math.floor(p.energy)+'/6';const s=Math.max(0,Math.ceil(world.time));$('timer').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');$('leaderContent').innerHTML=[...world.players].sort((a,b)=>b.share-a.share).map(q=>'<div><span><i class="dot" style="background:'+COLORS[q.color]+'"></i>'+escape(q.name)+'</span><b>'+Math.round(q.share*100)+'%</b></div>').join('');
 let info='';if(selected>=0){info=world.owner[selected]===mySlot?'أرضك المختارة • اضغط هدفاً للهجوم':'هدف: '+(world.owner[selected]?'خصم':'أرض محايدة')}else info='اختر أرضك ثم أرضاً أخرى لإرسال الجنود';$('selectionInfo').textContent=info;
}
function finishGame(slot){if(state==='result')return;world.finished=true;state='result';finishLoop();$('battleUi').classList.add('hidden');const win=slot===mySlot;setPanel('<div class="coverLogo">'+(win?'🏆':'⚔️')+'</div><div class="eyebrow">انتهت الجولة</div><h1 class="'+(win?'winTitle':'')+'">'+(win?'انتصرت ووسّعت نفوذك!':'انتهت معركة النفوذ')+'</h1><p>'+(world.players[slot-1]?.name||'المنتصر')+' سيطر على '+(Math.round((world.players[slot-1]?.share||0)*100))+'% من الخريطة.</p><div class="lobbyRows">'+[...world.players].sort((a,b)=>b.share-a.share).map(p=>'<div class="lobbyRow"><span><i class="dot" style="background:'+COLORS[p.color]+'"></i>'+escape(p.name)+'</span><b>'+Math.round(p.share*100)+'%</b></div>').join('')+'</div><button class="btn pri fullBtn" id="again">العب من جديد</button><button class="btn fullBtn" id="back">القائمة الرئيسية</button>');$('again').onclick=()=>{if(mode==='solo')startSolo();else menu()};$('back').onclick=menu}
function issue(target,asRally=false){if(!world||world.finished||state!=='game')return;if(mode==='online'&&roomRole==='guest'){publish({t:'command',target,portion:fraction,rally:asRally});return}if(!orderAttack(world,mySlot,target,fraction,asRally))notice('لا يمكن إصدار هذا الأمر. تأكد من القوات والقيادة والمسافة.');else if(asRally)notice('تم تثبيت نقطة التجمع')}
function clickTile(i){if(i<0||!world||world.water[i])return;if(selected<0){if(world.owner[i]!==mySlot){notice('ابدأ باختيار أرضك أولاً');return}selected=i;return}if(selected===i){selected=-1;return}if(rallyMode){issue(i,true);rallyMode=false;$('rallyBtn').classList.remove('active');selected=i;return}if(world.owner[selected]!==mySlot){selected=i;return}issue(i,false);selected=i}
function onPointerDown(e){if(state!=='game')return;pointer={id:e.pointerId,x:e.clientX,y:e.clientY,ox:cam.offsetX,oy:cam.offsetY,start:Date.now(),drag:false};canvas.setPointerCapture(e.pointerId)}
function onPointerMove(e){if(!pointer||pointer.id!==e.pointerId)return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;if(Math.abs(dx)+Math.abs(dy)>10)pointer.drag=true;if(pointer.drag){cam.offsetX=pointer.ox+dx;cam.offsetY=pointer.oy+dy}}
function onPointerUp(e){if(!pointer||pointer.id!==e.pointerId)return;if(!pointer.drag)clickTile(pointToTile(e.clientX,e.clientY));pointer=null;updateUi()}
canvas.addEventListener('pointerdown',onPointerDown);canvas.addEventListener('pointermove',onPointerMove);canvas.addEventListener('pointerup',onPointerUp);canvas.addEventListener('pointercancel',()=>pointer=null);
canvas.addEventListener('wheel',e=>{if(state!=='game')return;e.preventDefault();zoom(e.deltaY<0?1.16:1/1.16,e.clientX,e.clientY)},{passive:false});function zoom(q,x=viewW/2,y=viewH/2){const prev=cam.scale;cam.scale=clamp(cam.scale*q,Math.min(viewW/W,viewH/H)*.7,Math.min(viewW/W,viewH/H)*4.5);cam.offsetX=x-(x-cam.offsetX)*cam.scale/prev;cam.offsetY=y-(y-cam.offsetY)*cam.scale/prev}
$('zoomIn').onclick=()=>zoom(1.25);$('zoomOut').onclick=()=>zoom(.8);
document.querySelectorAll('[data-wave]').forEach(el=>el.onclick=()=>{fraction=Number(el.dataset.wave);document.querySelectorAll('[data-wave]').forEach(x=>x.classList.toggle('active',x===el));});
$('rallyBtn').onclick=()=>{rallyMode=!rallyMode;selected=-1;$('rallyBtn').classList.toggle('active',rallyMode);notice(rallyMode?'اختر هدفاً ليصبح نقطة التجمع':'تم إلغاء وضع التجمع')};
$('retreatBtn').onclick=()=>{if(world){const p=world.players[mySlot-1];if(p)p.rally=-1;if(mode==='online'&&roomRole==='guest')publish({t:'command',clearRally:true})}rallyMode=false;$('rallyBtn').classList.remove('active')};
$('exitBtn').onclick=menu;
window.addEventListener('resize',ensureDimensions);let keyboard=new Set();addEventListener('keydown',e=>{if(state!=='game')return;if(['Escape'].includes(e.key)){menu();return}if(e.key==='1')$('wave25').click();if(e.key==='2')$('wave50').click();if(e.key==='3')$('wave80').click();if(e.key.toLowerCase()==='r')$('rallyBtn').click()});
// ---------------------------------------------------------------------------
// Multiplayer: one host advances the simulation and broadcasts snapshots.
// ---------------------------------------------------------------------------
function cleanupNet(){connectVersion++;clearInterval(netTimer);clearTimeout(startTrigger);netTimer=0;startTrigger=0;if(client){try{client.end(true)}catch(e){}client=null}joined=false;room='';roster=[];roomRole='';}
function publish(data){if(!client?.connected||!room)return;client.publish('playhub/conquest/v1/'+room,JSON.stringify({v:1,room,id:meId,ts:Date.now(),...data}),{qos:data.t==='state'?0:1})}
function updateRoster(){if(state!=='lobby')return;$('joinedCount').textContent=roster.length+'/'+roomCap;const display=$('roster');display.innerHTML=Array.from({length:roomCap},(_,idx)=>{const p=roster.find(p=>p.slot===idx+1);return '<div class="lobbyRow"><span>'+(p?'<i class="dot" style="background:'+COLORS[p.color]+'"></i>'+escape(p.name):'— مكان فارغ —')+'</span><b>'+(p?'متصل':'بانتظار لاعب')+'</b></div>'}).join('');if(roster.length>=roomCap&&roomRole==='host'&&!startTrigger){startTrigger=setTimeout(()=>{startTrigger=0;if(state==='lobby'&&roster.length>=roomCap){world=spawnWorld(roomCap,duration);state='game';selected=world.players[mySlot-1]?.capital??-1;publish({t:'start',seed:world.seed,count:roomCap,duration,roster});publish(makeSnapshot(world));showGame();startLoop()}},3500)}if(roster.length<roomCap&&startTrigger){clearTimeout(startTrigger);startTrigger=0}}
function lobbyPanel(){state='lobby';setPanel('<div class="eyebrow">PLAYHUB • MULTIPLAYER</div><h1>غرفة صراع النفوذ</h1><p>عند اكتمال العدد، يبدأ العدّ التنازلي تلقائياً ويصبح المضيف مسؤولاً عن تحديث الخريطة.</p><span class="labelChip" id="joinedCount">1/'+roomCap+'</span><div id="roster" class="lobbyRows"></div><div class="field"><label>رابط الدعوة المباشر</label><div class="roomLink" id="roomShareLink">'+escape(shareUrl())+'</div></div><button class="btn pri fullBtn" id="shareRoom">نسخ / مشاركة الرابط فقط</button><button class="btn fullBtn" id="closeLobby">العودة</button>');$('shareRoom').onclick=async()=>{const url=shareUrl();if(navigator.share){try{await navigator.share({url});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(url);notice('تم نسخ الرابط المباشر')}catch(e){notice(url)}};$('closeLobby').onclick=menu;updateRoster()}
function connectBroker(n,ver){return new Promise((resolve,reject)=>{if(!window.mqtt?.connect){reject(Error('مكتبة الاتصال لم تُحمّل بعد'));return}let settled=false;const c=window.mqtt.connect(SERVERS[n],{clientId:'conquest_'+makeId(),clean:true,reconnectPeriod:2500,connectTimeout:6500});client=c;let timer=setTimeout(()=>{if(!settled){settled=true;try{c.end(true)}catch(e){}reject(Error('انتهت مهلة الاتصال'))}},8500);
 c.on('connect',()=>{if(ver!==connectVersion)return;joined=true;c.subscribe('playhub/conquest/v1/'+room,{qos:1},err=>{if(err){if(!settled){settled=true;clearTimeout(timer);reject(err)}return}if(!settled){settled=true;clearTimeout(timer);resolve()}if(roomRole==='guest')publish({t:'hello',name:prefs.name,color:prefs.color});if(roomRole==='host'&&state==='lobby')publish({t:'lobby',roster,cap:roomCap,duration})})});
 c.on('message',(topic,data)=>{if(ver!==connectVersion||topic!=='playhub/conquest/v1/'+room)return;try{const m=JSON.parse(data.toString());if(m.v!==1||m.room!==room||m.id===meId||Math.abs(Date.now()-m.ts)>50000)return;incoming(m)}catch(e){}});
 c.on('error',()=>{});c.on('close',()=>{joined=false;if(roomRole&&state!=='menu')notice('انقطع الاتصال مؤقتاً؛ نحاول الاستعادة')})
})}
async function createRoom(opts={}){cleanupNet();roomRole='host';mode='online';roomCap=MODES[opts.cap]||Number(opts.cap)||2;roomCap=clamp(roomCap,2,4);duration=opts.duration===900?900:600;roster=[{slot:1,id:meId,name:prefs.name,color:prefs.color}];mySlot=1;room='1-'+String(rand(100000,999999));state='connecting';setPanel('<div class="eyebrow">PLAYHUB LIVE</div><h1>إنشاء غرفة...</h1><p>نجرب السيرفرات المتاحة ثم نثبت رقم السيرفر في الرابط.</p>');const ver=++connectVersion;const order=opts.server==='auto'||!opts.server?[1,2]:[Number(opts.server)];let error;
 for(const n of order){brokerId=n;room=n+'-'+room.split('-').pop();try{await connectBroker(n,ver);if(ver!==connectVersion)return;lobbyPanel();report('playhub-room',{room,session});beginPresence();return}catch(e){error=e;if(client)try{client.end(true)}catch(x){}client=null}}
 setPanel('<h1>تعذر إنشاء الغرفة</h1><p>'+escape(error?.message||'السيرفر غير متاح')+'</p><button id="retryCreate" class="btn pri fullBtn">إعادة المحاولة</button><button id="back" class="btn fullBtn">عودة</button>');$('retryCreate').onclick=()=>createRoom(opts);$('back').onclick=menu;report('playhub-error',{session,message:String(error?.message||'فشل الاتصال')});}
async function joinRoom(code){cleanupNet();roomRole='guest';mode='online';room=String(code||'').trim();if(!/^[12]-\d{6}$/.test(room)){setPanel('<h1>رابط غير صالح</h1><button class="btn" id="back">عودة</button>');$('back').onclick=menu;return}brokerId=Number(room[0]);state='connecting';setPanel('<div class="eyebrow">PLAYHUB LIVE</div><h1>جاري دخول الغرفة...</h1><p>جارٍ الاتصال بنفس السيرفر الذي اختاره المنشئ.</p>');const ver=++connectVersion;
 try{await connectBroker(brokerId,ver);if(ver!==connectVersion)return;state='awaiting';setPanel('<div class="eyebrow">PLAYHUB LIVE</div><h1>بانتظار منشئ الغرفة...</h1><p>اتصلنا بالسيرفر وننتظر تأكيد الانضمام.</p><button class="btn fullBtn" id="back">عودة</button>');$('back').onclick=menu;report('playhub-room',{room,session});beginPresence();publish({t:'hello',name:prefs.name,color:prefs.color})}
 catch(e){setPanel('<h1>تعذر الاتصال</h1><p>'+escape(e.message)+'</p><button class="btn pri fullBtn" id="retry">إعادة المحاولة</button><button class="btn fullBtn" id="back">عودة</button>');$('retry').onclick=()=>joinRoom(code);$('back').onclick=menu;report('playhub-error',{session,message:e.message})}}
function beginPresence(){clearInterval(netTimer);netTimer=setInterval(()=>{if(!client?.connected)return;if(roomRole==='host'){if(state==='lobby'){publish({t:'lobby',roster,cap:roomCap,duration});updateRoster()}if(state==='game'&&world)publish(makeSnapshot(world))}else{publish({t:state==='game'?'alive':'hello',name:prefs.name,color:prefs.color})}},2200)}
function incoming(m){if(roomRole==='host'){
 if(m.t==='hello'&&state==='lobby'){let p=roster.find(p=>p.id===m.id);if(!p&&roster.length<roomCap){const slot=Array.from({length:roomCap},(_,i)=>i+1).find(x=>!roster.some(y=>y.slot===x));if(slot){p={slot,id:m.id,name:String(m.name||'لاعب').slice(0,18),color:clamp(Number(m.color)||0,0,3)};roster.push(p)}}publish({t:'lobby',roster,cap:roomCap,duration});updateRoster()}
 if(m.t==='command'&&state==='game'&&world&&!world.finished){const player=roster.find(p=>p.id===m.id);if(!player)return;if(m.clearRally){const pp=world.players[player.slot-1];if(pp)pp.rally=-1;return}orderAttack(world,player.slot,Number(m.target),clamp(Number(m.portion)||.5,.2,.8),!!m.rally)}
 }else if(roomRole==='guest'){
 if(m.t==='lobby'&&['awaiting','lobby'].includes(state)){const my=Array.isArray(m.roster)?m.roster.find(p=>p.id===meId):null;if(my){roster=m.roster;roomCap=m.cap||2;duration=m.duration||600;mySlot=my.slot;if(state!=='lobby')lobbyPanel();else updateRoster()}}
 if(m.t==='start'&&state!=='game'){roster=m.roster||roster;roomCap=m.count;duration=m.duration;mySlot=roster.find(x=>x.id===meId)?.slot||mySlot}
 if(m.t==='state'&&['lobby','awaiting','game'].includes(state)){const me=roster.find(x=>x.id===meId);if(me)mySlot=me.slot;applySnapshot(m)}
 }}
function applySession(m){if(!m||m.type!=='playhub-session'||m.game!=='conquest')return;if(m.session&&m.session===session&&state!=='menu')return;session=m.session||makeId();if(m.action==='join'&&m.room)joinRoom(m.room);else if(m.action==='create')createRoom({cap:2,duration:prefs.round,server:m.serverChoice||prefs.server});}
addEventListener('message',e=>{if(!fromHub()||e.source!==parent)return;const msg=e.data;if(msg?.type==='playhub-ping'){report('playhub-ready');return}applySession(msg)});
function boot(){ensureDimensions();const search=new URLSearchParams(location.search);if(!fromHub()&&search.get('room'))joinRoom(search.get('room'));else menu();report('playhub-ready')}
let uiTimer=setInterval(()=>{if(state==='game')updateUi()},300);
boot();
})();
