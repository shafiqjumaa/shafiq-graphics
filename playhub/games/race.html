<style>
:root{color-scheme:dark;--teal:#47e2d3;--gold:#f8c979;--ink:#071620;--glass:rgba(7,23,33,.87)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071620;color:#f2fbff;font-family:system-ui,'Segoe UI',Tahoma,sans-serif;touch-action:none;user-select:none}button,select,input{font:inherit}button{cursor:pointer;border:0;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.5;cursor:not-allowed}
#canvas{position:fixed;inset:0;display:block;width:100%;height:100%;background:radial-gradient(ellipse at 50% 40%,#154054,#051521);touch-action:none}#shade{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(5,17,25,.3),transparent 19%,transparent 72%,rgba(5,17,25,.48));z-index:1}
.glass{background:var(--glass);border:1px solid rgba(91,208,201,.23);border-radius:19px;box-shadow:0 12px 45px #0007;backdrop-filter:blur(12px)}
#hud{position:fixed;z-index:5;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:start;justify-content:space-between;gap:9px;pointer-events:none}#hud>div{pointer-events:auto}.hudstats{padding:9px 14px;min-width:142px}.eyebrow{color:var(--teal);font-size:9px;letter-spacing:1.5px;font-weight:900}.big{font-size:26px;font-weight:950;line-height:1.14;font-variant-numeric:tabular-nums}.unit{font-size:10px;color:#a8c6cb}.hud-right{display:flex;gap:7px;align-items:flex-start}.pill{padding:9px 12px;font-size:11px;font-weight:800;text-align:center}.pill b{color:var(--gold);font-size:14px;display:block}.pill strong{display:block;color:var(--teal);font-size:14px}.iconbtn{width:37px;height:37px;border:1px solid #4e8397aa;background:#12313fbf;color:#e0feff;border-radius:12px;font-size:18px}
#mini{position:fixed;z-index:5;top:104px;left:12px;width:122px;height:122px;padding:6px;background:#081725c8;border:1px solid #4b879988;border-radius:14px;pointer-events:none}
#raceBanner{position:fixed;inset:30% 0 auto;text-align:center;z-index:10;font-size:clamp(48px,14vw,94px);font-weight:1000;text-shadow:0 7px 30px #000b,0 0 25px #48ddd3;pointer-events:none;letter-spacing:2px}.count{color:var(--gold)}
#controls{position:fixed;z-index:8;left:12px;right:12px;bottom:max(18px,env(safe-area-inset-bottom));display:none;justify-content:space-between;gap:12px;pointer-events:none;direction:ltr}.driveGroup{display:flex;gap:12px;align-items:end;pointer-events:auto}.driveBtn{min-width:64px;height:71px;display:grid;place-items:center;border:1px solid #b4e2e45c;border-radius:20px;background:linear-gradient(145deg,#194358dd,#092332df);color:#eff;box-shadow:0 8px 23px #0006;font-size:26px;font-weight:900;touch-action:none}.driveBtn:active,.driveBtn.pressed{background:#2b8e91dd;transform:scale(.95)}.driveBtn.accel{height:89px;background:linear-gradient(145deg,#20ab91df,#105c65dd);font-size:15px}.driveBtn.nitro{height:68px;min-width:65px;border-color:#f3cc8f91;color:#fbe4b7;font-size:15px}
#centerPanel{position:fixed;z-index:12;top:50%;left:50%;transform:translate(-50%,-50%);width:min(92vw,530px);max-height:calc(100dvh - 38px);overflow-y:auto;padding:27px 25px;text-align:center;touch-action:pan-y}
#centerPanel.hidden,#hud.hidden,#mini.hidden,#controls.hidden,#raceBanner.hidden,#toast.hidden,#impactMessage.hidden{display:none!important}
h1{font-size:clamp(29px,7vw,45px);line-height:1.2;margin:6px 0 9px;font-weight:1000;letter-spacing:-1.2px}.muted{color:#9cbec7;font-size:13px;line-height:1.8}label{display:block;text-align:right;font-size:11px;color:#b5d3dc;font-weight:850;margin:17px 0 8px}.select{border:1px solid #416b7b;background:#102838;color:#f2ffff;width:100%;height:45px;border-radius:12px;padding:9px 14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cta{width:100%;padding:13px 17px;border-radius:14px;background:linear-gradient(135deg,#65f1d2,#29a9b1);color:#052b30;font-weight:950;margin-top:12px}.cta.alt{background:#1a3445;color:#daffff;border:1px solid #3a6676}.cta:active{transform:scale(.985)}.roomLink{font-size:11px;direction:ltr;overflow-wrap:anywhere;background:#061622;border:1px solid #3e6572;border-radius:10px;padding:12px;display:block;user-select:text;color:#bbffff}.roster{margin:13px 0 6px;display:grid;gap:7px;text-align:right}.rosterLine{display:flex;align-items:center;gap:9px;padding:9px 11px;background:#0f2b39;border-radius:10px;font-size:12px}.rosterColor{width:12px;height:12px;border-radius:4px;display:inline-block}.small{font-size:11px;color:#8db3bb}#toast{position:fixed;z-index:25;left:50%;bottom:121px;transform:translateX(-50%);width:max-content;max-width:90vw;background:#113341;padding:12px 15px;border-radius:12px;border:1px solid #5bcfc3;color:white;box-shadow:0 16px 40px #0009;font-size:12px}.progress{height:8px;background:#203a49;border-radius:99px;overflow:hidden;margin-top:7px}.progress>div{width:100%;height:100%;background:linear-gradient(90deg,#3d94c8,#57e8d3);border-radius:99px}.lobby-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.lobby-top span{font-size:11px;color:#71e1d2}
@media(max-width:600px){#hud{top:max(5px,env(safe-area-inset-top));left:6px;right:6px;gap:5px}.hudstats{min-width:95px;padding:8px 9px}.big{font-size:20px}.pill{padding:7px 8px;font-size:9px}.pill b,.pill strong{font-size:12px}.iconbtn{width:32px;height:33px}#mini{top:85px;left:6px;width:91px;height:91px}#controls{bottom:max(14px,env(safe-area-inset-bottom));left:8px;right:8px}.driveGroup{gap:7px}.driveBtn{min-width:60px;height:62px;border-radius:17px}.driveBtn.accel{height:80px}.driveBtn.nitro{min-width:55px}#centerPanel{padding:22px 17px}.row{gap:7px}}
#impactMessage{position:fixed;z-index:9;top:32%;left:50%;transform:translateX(-50%);border:1px solid #ffb67d88;border-radius:13px;padding:8px 16px;background:#2d2024da;color:#ffe4bb;box-shadow:0 8px 22px #0008;text-align:center;pointer-events:none;font-size:13px;font-weight:850;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.driveBtn{transition:none!important}}
</style>

<body>
<canvas id="canvas" aria-label="عالم سباق ثلاثي الأبعاد"></canvas><div id="shade"></div>
<div id="hud" class="hidden"><div class="glass hudstats"><span class="eyebrow" id="hudMap">SHIFT RACING</span><div><span id="speed" class="big">000</span> <span class="unit">KM/H</span></div><div class="unit">نيترو <span id="nitroNum">100%</span><div class="progress"><div id="nitroBar"></div></div></div></div><div class="hud-right"><div class="glass pill">اللفة<b id="lap">1 / 3</b></div><div class="glass pill">الترتيب<strong id="place">1 / 1</strong></div><div class="glass pill">الوقت<strong id="time">0:00</strong></div><button id="pauseBtn" class="iconbtn" title="إيقاف مؤقت">Ⅱ</button></div></div>
<canvas id="mini" class="hidden" width="244" height="244"></canvas><div id="impactMessage" class="hidden">⚠️ اصطدام! خفف السرعة</div><div id="raceBanner" class="hidden" aria-live="polite"></div>
<div id="controls" class="hidden"><div class="driveGroup"><button class="driveBtn" id="left" aria-label="يسار">◀</button><button class="driveBtn" id="right" aria-label="يمين">▶</button></div><div class="driveGroup"><button class="driveBtn nitro" id="nitro" aria-label="نيترو">NITRO</button><button class="driveBtn" id="brake" aria-label="فرامل">▾</button><button class="driveBtn accel" id="gas" aria-label="تسارع">GAS ▲</button></div></div>
<div id="centerPanel" class="glass"><div id="panelContent"></div></div><div id="toast" class="hidden" role="status"></div>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js" defer onerror="(function(){const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js';document.head.appendChild(s)})()"></script>
<script type="module">
const $=id=>document.getElementById(id), fromHub=()=>window.parent!==window;
const mapDefs={city:{name:'المدينة الليلية',sky:0x0e2137,fog:0x173347,ground:0x193849,road:0x303f4c,edge:0x67e4dc,prop:'city',width:14,rx:96,rz:81},coast:{name:'الساحل',sky:0x66c3d9,fog:0x8bdbe8,ground:0xcea968,road:0x46525b,edge:0xe8d8aa,prop:'coast',width:15,rx:106,rz:85},desert:{name:'الصحراء',sky:0xdba76c,fog:0xe5bb8d,ground:0xc7a06d,road:0x514943,edge:0xf4d5a1,prop:'desert',width:16,rx:113,rz:88},mountain:{name:'الجبال',sky:0x759cbb,fog:0xa1b7c8,ground:0x3f795c,road:0x454e53,edge:0xcee2d9,prop:'mountain',width:13,rx:96,rz:105}};
const modes={solo:{label:'تجربة فردية',max:1},duo:{label:'لاعبان',max:2},trio:{label:'3 لاعبين',max:3},quad:{label:'4 لاعبين',max:4},team:{label:'2 ضد 2',max:4}};
const colors=[0x31e6d2,0xffaa4f,0xb796ff,0xff6488];const STORAGE='ph_race_player_v1';
function randomToken(n=12){const a=new Uint8Array(n);if(crypto?.getRandomValues)crypto.getRandomValues(a);else for(let i=0;i<n;i++)a[i]=Math.random()*256;return Array.from(a,b=>b.toString(16).padStart(2,'0')).join('').slice(0,n*2)}
function randomRoom(){return '1-'+String(100000+Math.floor(Math.random()*900000))}
let id=sessionStorage.getItem(STORAGE);if(!id){id=randomToken(8);sessionStorage.setItem(STORAGE,id)}
const me={id,name:'متسابق '+id.slice(0,4),slot:0,team:0};
let cfg={map:'city',mode:'solo',laps:3},room='',host='',role='solo',phase='menu',roster=[],client=null,connected=false,topic='',sessionId='',lastRosterAt=0,heartbeat=0,lastSend=0,startAt=0,lastOnlineAt=0,finished={},raceEndAt=0,disconnectTimer=0;
let THREE=null,scene=null,renderer=null,camera=null,track=null,terrain=null,car3d=null,remoteCars=new Map(),obstacles=[],anim=0,lastTick=0,gameTime=0,renderReady=false,sceneBuildVersion=0,impactShownAt=-9999;
const k={left:false,right:false,gas:false,brake:false,nitro:false},motion={x:0,z:0,heading:0,speed:0,steering:0,nitro:100,t:0,lap:1,lastIndex:0,checkpoints:0,completed:false,finishTime:0};
function setPanel(html){$('panelContent').innerHTML=html;$('centerPanel').classList.remove('hidden')}
function hidePanel(){$('centerPanel').classList.add('hidden')}
function notify(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('toast').classList.add('hidden'),3400)}
const baseLink=()=>{const p=new URLSearchParams(location.search);let u;try{u=new URL(fromHub()?window.parent.location.href:location.href)}catch{u=new URL('https://shafiqjumaa.github.io/shafiq-graphics/playhub/')}if(u.protocol!=='https:'||u.hostname==='appassets.androidplatform.net'||u.protocol==='file:')u=new URL('https://shafiqjumaa.github.io/shafiq-graphics/playhub/');u.search='';u.hash='';u.searchParams.set('game','race');u.searchParams.set('room',room);return u.toString()};
async function copy(text){try{if(navigator.clipboard&&isSecureContext){await navigator.clipboard.writeText(text);return true}const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.left='-9999px';document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();return ok}catch{return false}}
async function share(){if(!room){notify('أنشئ غرفة أولاً');return}const url=baseLink();if(window.Android&&typeof Android.shareText==='function'){Android.shareText(url);return}if(navigator.share){try{await navigator.share({title:'انضم إلى سباق السيارات',url});return}catch(e){if(e.name==='AbortError')return}}if(await copy(url))notify('تم نسخ رابط السباق');else notify(url)}
function menu(){phase='menu';cfg.mode='solo';resetNetwork();showMenu()}
function showMenu(){setPanel(`<div class="eyebrow">PLAYHUB / 3D RACING</div><h1>سباق السرعة <span style="color:var(--teal)">3D</span></h1><p class="muted">4 خرائط • تصادم مع الحواجز والسيارات • نيترو • سباقات فردية وجماعية حتى أربعة لاعبين</p><div class="row"><div><label for="raceMap">الخريطة</label><select class="select" id="raceMap">${Object.entries(mapDefs).map(([id,m])=>`<option value="${id}" ${cfg.map===id?'selected':''}>${m.name}</option>`).join('')}</select></div><div><label for="raceMode">نمط السباق</label><select class="select" id="raceMode">${Object.entries(modes).map(([id,m])=>`<option value="${id}" ${cfg.mode===id?'selected':''}>${m.label}</option>`).join('')}</select></div></div><button class="cta" id="quickStart">ابدأ السباق</button><p class="small">القيادة: الأسهم أو WASD على الكمبيوتر، وأزرار اللمس على الهاتف. استخدم الفرامل قبل المنعطفات.</p><p class="small">عند اختيار سباق جماعي، تُنشأ غرفة واحدة ويحصل صديقك على رابط مباشر للدخول. يبدأ السباق عند اكتمال المتسابقين.</p>`);$('quickStart').onclick=()=>{cfg.map=$('raceMap').value;cfg.mode=$('raceMode').value;if(cfg.mode==='solo')solo();else createRoom({map:cfg.map,mode:cfg.mode})}}
function makeLinkPreview(){return `<div class="eyebrow">رابط الدعوة المباشر</div><div class="roomLink" id="linkPreview">${room?baseLink():'...'}</div><button id="sendLink" class="cta">↗ مشاركة الرابط فقط</button>`}
function lobby(){phase='lobby';const count=modes[cfg.mode]?.max||2;let show=(roster.length||1);
setPanel(`<div class="lobby-top"><span>${role==='host'?'أنت منشئ الغرفة':'أنت ضيف'}</span><span>متصل ${show} / ${count}</span></div><div class="eyebrow" style="margin-top:14px">SHIFT RACING • ONLINE</div><h1>بانتظار المتسابقين</h1><p class="muted">${mapDefs[cfg.map].name} · ${modes[cfg.mode].label}<br>عند اكتمال العدد تبدأ الجولة تلقائياً، بدون خطوات إضافية.</p><div class="roster">${Array.from({length:count},(_,i)=>{const p=roster.find(x=>x.slot===i);return `<div class="rosterLine"><span class="rosterColor" style="background:#${colors[i].toString(16).padStart(6,'0')}"></span>${p?(p.id===me.id?'أنت':escapeHtml(p.name)):'مكان فارغ — ينتظر لاعباً'}${cfg.mode==='team'?` <span class="small" style="margin-right:auto">فريق ${i%2+1}</span>`:''}</div>`}).join('')}</div>${makeLinkPreview()}<button id="leaveRoom" class="cta alt">العودة للبوابة</button>`);$('sendLink').onclick=share;$('leaveRoom').onclick=()=>{resetNetwork();showMenu()};$('hudMap').textContent=mapDefs[cfg.map].name}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,v=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[v]))}
const timestamp=()=>Date.now();
function emit(type,extra={}){if(!client?.connected||!topic)return;const m={v:1,type,id:me.id,room,ts:timestamp(),...extra};client.publish(topic,JSON.stringify(m),{qos:0,retain:false})}
function parentMsg(type,extra={}){if(fromHub())window.parent.postMessage({type,game:'race',...extra},'*')}
function err(message){parentMsg('playhub-error',{session:sessionId,message});notify(message);setPanel(`<h1>تعذّر الاتصال</h1><p class="muted">${escapeHtml(message)}</p><button class="cta" id="tryAgain">إعادة المحاولة</button><button class="cta alt" id="goBack">العودة</button>`);$('tryAgain').onclick=()=>role==='host'?createRoom(cfg):joinRoom(room);$('goBack').onclick=menu}
function ready(){parentMsg('playhub-ready')}
function resetNetwork(){clearInterval(heartbeat);clearTimeout(disconnectTimer);heartbeat=0;if(client){try{client.end(true)}catch{}}client=null;connected=false;room='';host='';roster=[];finished={};topic='';role='solo'}
function connect(){return new Promise((resolve,reject)=>{if(!window.mqtt?.connect){reject(new Error('خدمة الاتصال غير متاحة، تأكد من الإنترنت'));return}
  const opts={clientId:'ph_race_'+randomToken(8),clean:true,keepalive:25,reconnectPeriod:1600,connectTimeout:12000};client=window.mqtt.connect('wss://broker.emqx.io:8084/mqtt',opts);
  let done=false;const timeout=setTimeout(()=>{if(!done){done=true;reject(new Error('انتهت مهلة اتصال خادم السباق'))}},14500);
  client.on('connect',()=>{connected=true;client.subscribe(topic,{qos:0},e=>{if(e){if(!done){done=true;clearTimeout(timeout);reject(e)}}else{if(!done){done=true;clearTimeout(timeout);resolve()}if(role!=='solo')emit('hello',{name:me.name,slot:me.slot})}})});
  client.on('message',(t,p)=>{if(t!==topic)return;try{const m=JSON.parse(p.toString());if(m.v!==1||m.room!==room||m.id===me.id||m.ts<timestamp()-30000||Math.abs(m.ts-timestamp())>60000)return;receive(m)}catch(e){}});
  client.on('close',()=>{connected=false;if(phase==='race')notify('اتصال اللعب غير مستقر — يحاول إعادة الاتصال')});client.on('error',()=>{});
 })}
async function createRoom(settings={}){resetNetwork();cfg.map=mapDefs[settings.map]?settings.map:cfg.map;cfg.mode=modes[settings.mode]?settings.mode:'duo';if(cfg.mode==='solo'){solo();return}cfg.laps=3;role='host';host=me.id;room=randomRoom();topic='playhub/racing/v1/'+room;roster=[{id:me.id,name:me.name,slot:0,team:0}];me.slot=0;sessionId=settings.session||sessionId;phase='connecting';setPanel(`<div class="eyebrow">SERVER CONNECTION</div><h1>جاري إنشاء السباق...</h1><p class="muted">تأسيس غرفة واحدة على الخادم، دون ظهور شاشة إنشاء ثانية.</p>`);
try{await connect();lobby();parentMsg('playhub-room',{room,session:sessionId});publishLobby();beginHeartbeat()}catch(e){err(String(e.message||e))}}
async function joinRoom(code){resetNetwork();role='guest';room=String(code||'').trim();if(!/^1-\d{6}$/.test(room)){err('رابط السباق غير صالح');return}topic='playhub/racing/v1/'+room;phase='connecting';setPanel('<h1>جاري دخول السباق...</h1><p class="muted">ندخلك إلى الغرفة مباشرة عبر الرابط دون إنشاء غرفة أخرى.</p>');try{await connect();phase='lobby';setPanel('<h1>بانتظار منشئ السباق...</h1><p class="muted">تم الاتصال بالخادم. نبحث عن تفاصيل الغرفة.</p>');parentMsg('playhub-room',{room,session:sessionId});beginHeartbeat();disconnectTimer=setTimeout(()=>{if(!host&&phase==='lobby')err('تعذّر العثور على الغرفة. قد يكون المنشئ غادر أو انتهى السباق.')},12500)}catch(e){err(String(e.message||e))}}
function beginHeartbeat(){clearInterval(heartbeat);heartbeat=setInterval(()=>{if(!connected)return;emit('hello',{name:me.name,slot:me.slot});if(role==='host'){pruneRoster();publishLobby();if(phase==='lobby'&&roster.length>=modes[cfg.mode].max)startRace()}}
,1400)}
const presences=new Map();function pruneRoster(){if(role!=='host')return;const now=timestamp();roster=roster.filter(p=>p.id===me.id||(now-(presences.get(p.id)||0)<7000));if(!roster.some(p=>p.id===me.id))roster.unshift({id:me.id,name:me.name,slot:0,team:0})}
function publishLobby(){if(role!=='host')return;emit('lobby',{cfg,host:me.id,roster,phase,startAt});}
function receive(m){if(m.type==='hello'){if(role==='host'){
   presences.set(m.id,timestamp());if(!roster.some(p=>p.id===m.id)&&phase==='lobby'&&roster.length<modes[cfg.mode].max){const slots=new Set(roster.map(p=>p.slot));let slot=0;while(slots.has(slot))slot++;roster.push({id:m.id,name:String(m.name||'لاعب').slice(0,22),slot,team:slot%2});publishLobby();lobby()}
 }return}
 if(m.type==='lobby'&&role==='guest'){host=m.host;if(m.id!==host)return;const prev=roster.length;roster=Array.isArray(m.roster)?m.roster.slice(0,4):[];const c=m.cfg||{};cfg={map:mapDefs[c.map]?c.map:'city',mode:modes[c.mode]?c.mode:'duo',laps:3};const p=roster.find(p=>p.id===me.id);if(p){me.slot=p.slot;me.team=p.team}else{emit('hello',{name:me.name})}
  if(m.phase==='countdown'||m.phase==='race'){if(m.startAt){startAt=m.startAt;if(phase!=='countdown'&&phase!=='race')beginCountdown()}return}
  if(phase==='lobby'&&roster.length!==prev)lobby();else if(phase==='lobby'&&prev===0)lobby();return}
 if(m.type==='start'&&role==='guest'&&m.id===host){const c=m.cfg||{};cfg.map=mapDefs[c.map]?c.map:'city';cfg.mode=modes[c.mode]?c.mode:'duo';cfg.laps=3;roster=Array.isArray(m.roster)?m.roster:roster;const slot=roster.find(x=>x.id===me.id)?.slot;if(slot==null)return;me.slot=slot;me.team=slot%2;startAt=m.startAt;beginCountdown();return}
 if(m.type==='position'&&phase==='race'&&m.id!==me.id){if(!roster.some(p=>p.id===m.id))return;setRemotePos(m.id,m);return}
 if(m.type==='finish'){finished[m.id]=Number(m.elapsed)||0;showEndMaybe();return}

function setRemotePos(playerId,m){const d=remoteCars.get(playerId);if(!d)return;if(![m.x,m.z,m.heading,m.speed,m.lap].every(Number.isFinite))return;d.target={x:Math.max(-270,Math.min(270,m.x)),z:Math.max(-270,Math.min(270,m.z)),heading:m.heading,speed:m.speed,lap:m.lap,t:m.t,finish:!!m.finish};d.ts=timestamp()}
function syncPosition(){if(role==='solo'||!connected)return;const now=performance.now();if(now-lastSend<110)return;lastSend=now;emit('position',{x:+motion.x.toFixed(2),z:+motion.z.toFixed(2),heading:+motion.heading.toFixed(3),speed:+motion.speed.toFixed(1),lap:motion.lap,t:+motion.t.toFixed(4),finish:motion.completed})}
function updateOthers(dt){for(const d of remoteCars.values()){if(!d.target)continue;const tar=d.target;const alpha=Math.min(1,dt*8);d.obj.position.x+=(tar.x-d.obj.position.x)*alpha;d.obj.position.z+=(tar.z-d.obj.position.z)*alpha;d.obj.position.y=.2+sample(tar.t||0).y;let a=d.obj.rotation.y,delta=Math.atan2(Math.sin(tar.heading-a),Math.cos(tar.heading-a));d.obj.rotation.y+=delta*alpha}}
function doCamera(dt){if(!car3d||!camera)return;const back=13+Math.max(0,motion.speed)*.07;const angle=motion.heading;const desired=new THREE.Vector3(motion.x-Math.sin(angle)*back,8.5+Math.min(3.5,motion.speed*.04),motion.z-Math.cos(angle)*back);camera.position.lerp(desired,Math.min(1,dt*5));camera.lookAt(motion.x,2,motion.z)}
function showEndMaybe(){if(phase!=='race'&&phase!=='ended')return;if(role!=='solo'&&roster.some(p=>!finished[p.id])){if(motion.completed){setPanel(`<h1>وصلت إلى النهاية!</h1><p class="muted">وقتك: ${formatTime(gameTime)}<br>بانتظار بقية المتسابقين...</p>`)}return}
phase='ended';let sorted=roster.map(p=>({...p,finish:finished[p.id]||0})).sort((a,b)=>a.finish-b.finish);let teamText='';if(cfg.mode==='team'){let scores=[0,0];for(const p of sorted)scores[p.slot%2]+=p.finish;teamText=`<p style="color:var(--gold)">الفريق الفائز: ${scores[0]===scores[1]?'تعادل':(scores[0]<scores[1]?'الأول':'الثاني')}</p>`}setPanel(`<div class="eyebrow">RACE RESULTS</div><h1>انتهى السباق 🏁</h1>${teamText}<div class="roster">${sorted.map((p,i)=>`<div class="rosterLine"><b>${i+1}.</b>${escapeHtml(p.name)} <span style="margin-right:auto">${formatTime(p.finish)}</span></div>`).join('')}</div><button id="again" class="cta">سباق جديد</button>`);$('again').onclick=()=>{if(role==='solo')solo();else{resetNetwork();showMenu()}}}
function formatTime(s){return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')+'.'+String(Math.floor((s%1)*10))}
function drawMini(){const canvas=$('mini');const ctx=canvas.getContext('2d');if(!ctx||!track)return;const w=canvas.width,h=canvas.height,scale=.42;ctx.clearRect(0,0,w,h);ctx.lineWidth=10;ctx.strokeStyle='#365461';ctx.beginPath();for(let i=0;i<track.length;i++){let p=track[i],x=w/2+p.x*scale,y=h/2+p.z*scale;if(!i)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath();ctx.stroke();ctx.lineWidth=3;ctx.strokeStyle='#b3e9e1';ctx.stroke();for(const p of roster){let x,z;if(p.id===me.id){x=motion.x;z=motion.z}else{let d=remoteCars.get(p.id);if(!d)continue;x=d.obj.position.x;z=d.obj.position.z}ctx.beginPath();ctx.fillStyle='#'+colors[p.slot%4].toString(16).padStart(6,'0');ctx.arc(w/2+x*scale,h/2+z*scale,p.id===me.id?6:4,0,Math.PI*2);ctx.fill()}}
function updateHud(){if(phase!=='race'&&phase!=='countdown')return;$('speed').textContent=String(Math.round(Math.abs(motion.speed)*2.9)).padStart(3,'0');$('nitroNum').textContent=Math.round(motion.nitro)+'%';$('nitroBar').style.width=motion.nitro+'%';$('lap').textContent=Math.min(cfg.laps,motion.lap)+' / '+cfg.laps;$('time').textContent=formatTime(gameTime).split('.')[0];let position=1;for(const [pid,rem] of remoteCars){if(!rem.target)continue;if(rem.target.lap>motion.lap||(rem.target.lap===motion.lap&&rem.target.t>motion.t))position++}$('place').textContent=position+' / '+roster.length}
function frame(now){anim=requestAnimationFrame(frame);const dt=Math.min(.04,Math.max(0,(now-lastTick)/1000||0));lastTick=now;if(!renderReady||!renderer||!scene)return;if(phase==='race'){gameTime+=dt;updatePhysics(dt);updateOthers(dt);syncPosition();updateHud();if(Math.floor(now/120)!==Math.floor((now-dt*1000)/120))drawMini()}if(phase==='countdown'){updateHud()}if(car3d)doCamera(dt);if(performance.now()-impactShownAt>1150)$('impactMessage').classList.add('hidden');renderer.render(scene,camera)}
function isTouchDevice(){return matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0}
for(const el of ['left','right','gas','brake','nitro']){const b=$(el);const down=e=>{e.preventDefault();k[el]=true;b.classList.add('pressed');try{b.setPointerCapture(e.pointerId)}catch{}};const up=e=>{e.preventDefault();k[el]=false;b.classList.remove('pressed')};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up)}
addEventListener('blur',()=>{for(const key of Object.keys(k))k[key]=false;document.querySelectorAll('.driveBtn').forEach(b=>b.classList.remove('pressed'))});document.addEventListener('visibilitychange',()=>{if(document.hidden)for(const key of Object.keys(k))k[key]=false});
const keys={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'gas',KeyW:'gas',ArrowDown:'brake',KeyS:'brake',Space:'nitro',ShiftLeft:'nitro'};addEventListener('keydown',e=>{if(keys[e.code]){e.preventDefault();k[keys[e.code]]=true}});addEventListener('keyup',e=>{if(keys[e.code]){e.preventDefault();k[keys[e.code]]=false}});
$('pauseBtn').onclick=()=>{if(role!=='solo'){notify('الإيقاف المؤقت غير متاح أثناء اللعب الجماعي');return}if(phase==='race'){phase='paused';setPanel('<h1>السباق متوقف</h1><p class="muted">اضغط متابعة للعودة إلى الحلبة.</p><button class="cta" id="resume">متابعة السباق</button><button class="cta alt" id="quit">خروج</button>');$('resume').onclick=()=>{phase='race';hidePanel()};$('quit').onclick=menu}else if(phase==='paused'){phase='race';hidePanel()}};
function applySession(msg){if(!msg||msg.type!=='playhub-session'||msg.game!=='race')return;if(sessionId===msg.session&&phase!=='menu')return;sessionId=msg.session||randomToken(6);const map=mapDefs[msg.map]?msg.map:'city',mode=modes[msg.mode]?msg.mode:'duo';cfg.map=map;cfg.mode=mode;if(msg.action==='create')createRoom({map,mode,session:sessionId});else if(msg.action==='join'&&/^1-\d{6}$/.test(msg.room||''))joinRoom(msg.room)}
addEventListener('message',e=>{if(!fromHub()||e.source!==window.parent)return;if(e.data?.type==='playhub-ping'){ready();return}applySession(e.data)});
const query=new URLSearchParams(location.search);
if(!fromHub()&&query.get('room')){joinRoom(query.get('room'))}else if(!fromHub()&&query.get('action')==='create'){cfg.map=mapDefs[query.get('map')]?query.get('map'):'city';cfg.mode=modes[query.get('mode')]?query.get('mode'):'duo';createRoom(cfg)}else showMenu();
ready();addEventListener('pagehide',()=>{resetNetwork();cancelAnimationFrame(anim)});
</script>
</body>
